name: Validate catalog

# Gate for the automated product pipeline (see docs/automated-product-pipeline.md):
# any PR that touches the catalog or product artwork must pass schema +
# business-rule validation before it can be merged.
on:
  pull_request:
    paths:
      - 'catalog/**'
      - 'public/products/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # No "npm ci" needed — the validator is dependency-free (Node built-ins only).
      - name: Validate catalog/products.json
        run: node scripts/validate-catalog.mjs
